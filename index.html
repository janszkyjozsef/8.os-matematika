\xEDj vagy kedvezm\xE9ny.","A munkamodellhez azonos \xFCtem \xE9s feloszthat\xF3 teljes munka kell.","A ter\xFClet k\xE9t ir\xE1ny m\xE9ret\xE9t szorozza \xF6ssze.")}),explanation:[{heading:"Az ar\xE1ny nem ugyanaz, mint a k\xFCl\xF6nbs\xE9g",body:"A 2 k\xE9k \xE9s 6 feh\xE9r gy\xF6ngyb\u0151l \xE1ll\xF3 kever\xE9kben minden k\xE9kre 3 feh\xE9r jut. A 4 k\xE9k \xE9s 12 feh\xE9r ugyanilyen kever\xE9k: mindk\xE9t mennyis\xE9g k\xE9tszeres. A 3 k\xE9k \xE9s 7 feh\xE9r viszont m\xE1s ar\xE1ny, noha a darabsz\xE1mok k\xFCl\xF6nbs\xE9ge ugyan\xFAgy 4.",formula:"2 : 6 = 4 : 12 = 1 : 3; 3 : 7 \u2260 1 : 3",bullets:["K\xF6z\xF6s pozit\xEDv szorz\xE1s meg\u0151rzi az ar\xE1nyt: (2 \xD7 2)/(6 \xD7 2) = 2/6.","Azonos hozz\xE1ad\xE1s \xE1ltal\xE1ban a k\xFCl\xF6nbs\xE9get \u0151rzi, nem az ar\xE1nyt."]},{heading:"Sorrend \xE9s egys\xE9g",body:"El\u0151bb mondd meg, melyik mennyis\xE9get melyikhez viszony\xEDtod: k\xE9k : feh\xE9r \xE9s feh\xE9r : k\xE9k m\xE1s ar\xE1ny. Azonos fajt\xE1j\xFA mennyis\xE9get azonos egys\xE9gre v\xE1ltunk. K\xFCl\xF6nb\xF6z\u0151 mennyis\xE9gek h\xE1nyados\xE1hoz \xFAj egys\xE9g tartozik.",formula:"2 m : 50 cm = 200 cm : 50 cm = 4 : 1; 900 Ft : 2,5 m = 360 Ft/m",bullets:["Ebben a leck\xE9ben nemnegat\xEDv, ford\xEDtott ar\xE1nyoss\xE1gn\xE1l pozit\xEDv mennyis\xE9gekkel dolgozunk.","A darabsz\xE1mok eg\xE9sz sz\xE1mok; a sz\xE1m\xEDtott t\xF6rtr\xE9sz nem mindig megengedett l\xE9tsz\xE1m."]},{heading:"Egyenes ar\xE1nyoss\xE1g: \xE1lland\xF3 h\xE1nyados",body:"A zsin\xF3r m\xE9tere 400 Ft, nincs alapd\xEDj vagy kedvezm\xE9ny. \xCDgy 1 m 400 Ft, 1,5 m 600 Ft, 3 m 1200 Ft. Minden pozit\xEDv hosszn\xE1l ugyanannyi p\xE9nz jut egy m\xE9terre. Ha a hossz egy pozit\xEDv t\xE9nyez\u0151vel v\xE1ltozik, az \xE1r is ugyanannyiszoros.",formula:"y/x = k; y = kx; itt k = 400 Ft/m",bullets:["A nulla hosszhoz itt nulla \xE1r tartozik, de 0/0 h\xE1nyadost nem sz\xE1m\xEDtunk.","A \u201Emindkett\u0151 n\u0151\u201D megfigyel\xE9s \xF6nmag\xE1ban nem bizony\xEDt egyenes ar\xE1nyoss\xE1got."]},{heading:"Alapd\xEDj: egyenes grafikon, de nem egyenes ar\xE1nyoss\xE1g",body:"Az 500 Ft alapd\xEDj + 200 Ft/km modellben 2 km teljes d\xEDja 900 Ft, 4 km-\xE9 1300 Ft. A t\xE1vols\xE1g k\xE9tszerez\u0151d\xF6tt, a d\xEDj nem. A pozit\xEDv adatp\xE1rok h\xE1nyadosa 450 \xE9s 325 Ft/km; nem \xE1lland\xF3. Az alapd\xEDjon fel\xFCli r\xE9sz viszont minden kilom\xE9tern\xE9l 200 Ft-tal v\xE1ltozik.",formula:"y = 500 + 200x; y \u2212 500 = 200x",bullets:["A grafikon egyenes, de nem az orig\xF3n halad \xE1t.","Az \xE1lland\xF3 n\xF6vekm\xE9ny nem ugyanaz, mint az \xE1lland\xF3 h\xE1nyados."]},{heading:"Ford\xEDtott ar\xE1nyoss\xE1g: \xE1lland\xF3 szorzat",body:"Egy munka \xF6sszesen 24 seg\xEDt\u0151\xF3ra. Egy seg\xEDt\u0151 24 \xF3r\xE1t, 3 seg\xEDt\u0151 fejenk\xE9nt 8 \xF3r\xE1t, 6 seg\xEDt\u0151 4 \xF3r\xE1t, 8 seg\xEDt\u0151 3 \xF3r\xE1t dolgozik. A l\xE9tsz\xE1m \xE9s az id\u0151 szorzata ugyanaz. M\xE1sf\xE9lszeres l\xE9tsz\xE1mhoz az id\u0151t m\xE1sf\xE9llel osztjuk.",formula:"n \xD7 t = W; t = W/n; itt W = 24 seg\xEDt\u0151\xF3ra",bullets:[ln,"A seg\xEDt\u0151k sz\xE1ma pozit\xEDv eg\xE9sz. Nulla seg\xEDt\u0151h\xF6z nem rendel\xFCnk v\xE9ges elk\xE9sz\xFCl\xE9si id\u0151t.","5 seg\xEDt\u0151n\xE9l 24/5 \xF3ra = 4,8 \xF3ra: az id\u0151 lehet t\xF6rt, a l\xE9tsz\xE1m nem."]},{heading:"A cs\xF6kken\xE9s \xF6nmag\xE1ban kev\xE9s",body:"Egy 60 oldalas sz\xF6vegb\u0151l \xF3r\xE1nk\xE9nt 10 oldal fogy. 1, 2, 3 \xF3ra ut\xE1n 50, 40, 30 oldal marad. Az id\u0151 \xE9s a h\xE1tral\xE9v\u0151 oldalak szorzatai 50, 80, 90: nem \xE1lland\xF3k. Ez \xE1lland\xF3 k\xFCl\xF6nbs\xE9g\u0171 cs\xF6kken\xE9s, nem ford\xEDtott ar\xE1nyoss\xE1g.",formula:"H\xE1tral\xE9v\u0151 oldal = 60 \u2212 10 \xD7 eltelt \xF3ra; 0 \u2264 id\u0151 \u2264 6",bullets:["A sz\xF6veg elfogy\xE1sa ut\xE1n nem keletkezik negat\xEDv oldalsz\xE1m.","\u201EAz egyik n\u0151, a m\xE1sik cs\xF6kken\u201D nem el\xE9g a modell azonos\xEDt\xE1s\xE1hoz."]},{heading:"Modellv\xE1laszt\xE1s \xF6t k\xE9rd\xE9ssel",body:"Nevezd meg a k\xE9t mennyis\xE9get \xE9s egys\xE9g\xFCket; r\xF6gz\xEDtsd, mit tartunk v\xE1ltozatlannak; j\xF3solj az eredm\xE9nyre; vizsg\xE1ld a h\xE1nyadost vagy szorzatot; majd ellen\u0151rizz az eredeti t\xF6rt\xE9netben.",bullets:["Egyetlen adatp\xE1r nem igazol ar\xE1nyoss\xE1got.","T\xF6bb egyez\u0151 h\xE1nyados vagy szorzat hasznos ellen\u0151rz\xE9s, de a teljes tartom\xE1nyra \xE9rv\xE9nyes modellhez felt\xE9telek is kellenek.","Az egys\xE9gre visszavezet\xE9s megmutatja az \xE1lland\xF3t, de egy k\xF6nnyebb k\xF6z\xF6s l\xE9pt\xE9k is haszn\xE1lhat\xF3."]},{heading:"Ar\xE1ny szerinti feloszt\xE1s",body:"A 3 : 5 ar\xE1ny k\xE9t r\xE9sz egym\xE1shoz viszony\xEDtott nagys\xE1ga. Egy\xFCtt 8 egyenl\u0151 ar\xE1nyr\xE9szt alkotnak. Ha a teljes \xF6sszeget osztjuk fel, az els\u0151 r\xE9sz az eg\xE9sz 3/8-a, a m\xE1sodik 5/8-a. A 3/5 az els\u0151 r\xE9sznek a m\xE1sodikhoz viszony\xEDtott ar\xE1nya.",formula:"1600 : 8 = 200; 3 \xD7 200 = 600; 5 \xD7 200 = 1000",bullets:["Ellen\u0151rizd az \xF6sszeget is: 600 + 1000 = 1600.","Ellen\u0151rizd az ar\xE1nyt is: 600 : 1000 = 3 : 5."]},{heading:"M\xE9retar\xE1ny \xE9s k\xE9tir\xE1ny\xFA nagy\xEDt\xE1s",body:"Az 1 : 25 000 t\xE9rk\xE9pi m\xE9retar\xE1ny azonos hossz\xFAs\xE1gegys\xE9gben \xE9rtend\u0151: 1 cm a rajzon 25 000 cm a val\xF3s\xE1gban. Minden ir\xE1ny\xFA k\xE9tszeres nagy\xEDt\xE1skor a ker\xFClet k\xE9tszeres, a ter\xFClet n\xE9gyszeres. K\xE9t k\xFCl\xF6n ir\xE1ny szorz\xF3dik, ez\xE9rt a ter\xFClet nem a hossz nagy\xEDt\xE1si t\xE9nyez\u0151j\xE9vel ar\xE1nyos.",formula:"1 t\xE9rk\xE9pi cm = 250 val\xF3s m; ter\xFCleti t\xE9nyez\u0151 = 2 \xD7 2 = 4",bullets:["A t\xE9rk\xE9pi egyenes szakasz nem felt\xE9tlen\xFCl egy kanyarg\xF3 \xFAtvonal hossza.","A tervrajz ugyanezt az azonos egys\xE9g\u0171 hosszar\xE1nyt haszn\xE1lja; p\xE9ld\xE1ul 1 : 50 eset\xE9n 4 cm 2 m-nek felel meg."]},{heading:"\xD6t hibaminta helyett \xF6t vizsg\xE1lat",body:"Egy rossz v\xE9geredm\xE9nyb\u0151l nem \xE1llap\xEDtjuk meg biztosan a t\xE9vk\xE9pzetet. N\xE9zd meg, melyik \xE1ll\xEDt\xE1sra \xE9p\xFClt a megold\xE1sod.",bullets:["\u201EUgyanannyit adtam hozz\xE1, ez\xE9rt ugyanaz az ar\xE1ny.\u201D Ellenpr\xF3ba: 2 : 6 \xE9s 3 : 7.","\u201EMindkett\u0151 n\u0151, teh\xE1t egyenes.\u201D Vizsg\xE1ld az alapd\xEDjas \xFAt h\xE1nyadosait.","\u201EEgyik cs\xF6kken, teh\xE1t ford\xEDtott.\u201D Vizsg\xE1ld a h\xE1tral\xE9v\u0151 oldalak szorzatait.","\u201ET\xF6bb ember mindig ar\xE1nyosan gyorsabb.\u201D K\xE9rdezz r\xE1 a v\xE1rakoz\xE1sra, feloszthat\xF3s\xE1gra \xE9s munka\xFCtemre.","\u201E3 : 5 eset\xE9n az els\u0151 r\xE9sz az eg\xE9sz 3/5-e.\u201D Az eg\xE9sz 8 ar\xE1nyr\xE9szb\u0151l \xE1ll."]}],examples:[{title:"A\u2013P1 \u2014 Egy m\xE9terb\u0151l gondolkodva",prompt:"2,5 m dekorzsin\xF3r 900 Ft. Mennyi 7 m \xE1ra v\xE1ltozatlan egys\xE9g\xE1rral, alapd\xEDj \xE9s kedvezm\xE9ny n\xE9lk\xFCl?",steps:w(["900 : 2,5 = 360 Ft/m","Az \xF6sszes \xE1rb\xF3l egy m\xE9terre jut\xF3 \xE1rat keres\xFCnk."],["7 \xD7 360 = 2520 Ft","Minden m\xE9ter ugyanannyiba ker\xFCl."],["2520 : 7 = 360 Ft/m","A h\xE1nyados visszaadja az eredeti egys\xE9g\xE1rat."]),alternative:w(["5 m: 1800 Ft; 7,5 m: 2700 Ft","K\xF6nnyen \xE1ttekinthet\u0151 t\xF6bbsz\xF6r\xF6s\xF6kkel becs\xFCl\xFCnk."],["1800 < 2520 < 2700","A 7 m hossznak megfelel\u0151 \xE1r a kett\u0151 k\xF6z\xE9 esik."]),check:"2520 : 7 = 360 Ft/m; az \xE1r a 5 m \xE9s 7,5 m \xE1ra k\xF6z\xE9 esik."},{title:"A\u2013P2 \u2014 T\xF6bb g\xE9p, ugyanaz a munka",prompt:"N\xE9gy azonos nyomtat\xF3 12 perc alatt k\xE9sz\xEDt el egy adott k\xE1rtyamennyis\xE9get. Mennyi id\u0151 kell hat ilyen nyomtat\xF3nak? Azonos, \xE1lland\xF3 \xFCtemmel, szabad feloszthat\xF3s\xE1ggal, egyidej\u0171 indul\xE1ssal, k\xF6z\xF6s sz\u0171k keresztmetszet \xE9s el\u0151k\xE9sz\xEDt\xE9si id\u0151 n\xE9lk\xFCl sz\xE1molunk.",steps:w(["4 \xD7 12 = 48 g\xE9pperc","A teljes munkamennyis\xE9g r\xF6gz\xEDtett."],["48 : 6 = 8 perc","A munk\xE1t hat egyforma g\xE9p k\xF6z\xF6tt osztjuk el."],["6 \xD7 8 = 48 g\xE9pperc","A szorzat ugyanaz maradt."]),alternative:w(["6/4 = 1,5","A g\xE9psz\xE1m m\xE1sf\xE9lszeres\xE9re v\xE1ltozott."],["12 : 1,5 = 8 perc","Ford\xEDtott ar\xE1nyoss\xE1gn\xE1l az id\u0151t ugyanazzal a t\xE9nyez\u0151vel osztjuk."]),check:"8 perc kisebb 12-n\xE9l, \xE9s 6 \xD7 8 = 4 \xD7 12. A k\xF6vetkeztet\xE9s a megadott felt\xE9telekre vonatkozik."}],practice:[M("aranyossag","practice-1","A\u2013G01","Eredetileg 3 piros \xE9s 9 feh\xE9r gy\xF6ngy van. Melyik \xF6ssze\xE1ll\xEDt\xE1s \u0151rzi a piros : feh\xE9r ar\xE1nyt? D\xF6nts mindh\xE1romr\xF3l: A: 6 piros, 18 feh\xE9r; B: 5 piros, 11 feh\xE9r; C: 4 piros, 12 feh\xE9r. Indokold, mi\xE9rt nem el\xE9g a k\xFCl\xF6nbs\xE9get n\xE9zni.",E(y("a","A meg\u0151rzi az ar\xE1nyt?",le(!0)),y("b","B meg\u0151rzi az ar\xE1nyt?",le(!1),[["yes","A k\xFCl\xF6nbs\xE9g val\xF3ban 6, de egy pirosra nem 3 feh\xE9r jut: \xF6t piroshoz 15 feh\xE9r kellene."]]),y("c","C meg\u0151rzi az ar\xE1nyt?",le(!0))),["Egy pirosra h\xE1ny feh\xE9r jut az eredetiben \xE9s az \xFAj \xF6ssze\xE1ll\xEDt\xE1sokban?","3 : 9 = 1 : 3. Ellen\u0151rizd, a feh\xE9rek sz\xE1ma a pirosak h\xE1romszorosa-e."],w(["3/9 = 1/3; 6/18 = 1/3; 4/12 = 1/3","A \xE9s C ugyanazt az ar\xE1nyt adja."],["5/11 \u2260 1/3","B-ben \xF6t piros mell\xE9 15 feh\xE9r kellene."],["9 \u2212 3 = 11 \u2212 5 = 6","A k\xFCl\xF6nbs\xE9g egyez\xE9se nem \u0151rzi a kever\xE9si ar\xE1nyt."]),"Az ar\xE1nyt k\xF6z\xF6s szorz\xE1s, nem \xE1ltal\xE1ban azonos hozz\xE1ad\xE1s \u0151rzi.",{kind:"reason",reflection:L("Mutass r\xE1 B p\xE9ld\xE1j\xE1n a k\xFCl\xF6nbs\xE9g \xE9s ar\xE1ny elt\xE9r\xE9s\xE9re.","A k\xFCl\xF6nbs\xE9g 6 mindkett\u0151ben.","A 5 : 11 h\xE1nyados elt\xE9r a 3 : 9-t\u0151l.")}),M("aranyossag","practice-2","A\u2013G02","4,5 kg alma 1800 Ft. V\xE1ltozatlan kilogrammonk\xE9nti \xE1rral, kedvezm\xE9ny \xE9s m\xE1s d\xEDj n\xE9lk\xFCl mennyibe ker\xFCl 1,75 kg? Add meg az egys\xE9g\xE1rat is.",E(y("u
