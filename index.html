xD7 2 = 4-szeres","Mindk\xE9t hosszm\xE9ret megk\xE9tszerez\u0151d\xF6tt."]),"A \u201Ek\xE9tszer annyi\u201D hat\xE1sa a kapcsolatt\xF3l \xE9s a felt\xE9telekt\u0151l f\xFCgg.",{kind:"reason",reflection:Z("V\xE1lassz egy j\xF3slatot, \xE9s nevezd meg a d\xF6nt\u0151 felt\xE9telt.","Egys\xE9g\xE1rn\xE1l nincs alapd\xEDj vagy kedvezm\xE9ny.","A munkamodellhez azonos \xFCtem \xE9s feloszthat\xF3 teljes munka kell.","A ter\xFClet k\xE9t ir\xE1ny m\xE9ret\xE9t szorozza \xF6ssze.")}),explanation:[{heading:"Az ar\xE1ny nem ugyanaz, mint a k\xFCl\xF6nbs\xE9g",body:"A 2 k\xE9k \xE9s 6 feh\xE9r gy\xF6ngyb\u0151l \xE1ll\xF3 kever\xE9kben minden k\xE9kre 3 feh\xE9r jut. A 4 k\xE9k \xE9s 12 feh\xE9r ugyanilyen kever\xE9k: mindk\xE9t mennyis\xE9g k\xE9tszeres. A 3 k\xE9k \xE9s 7 feh\xE9r viszont m\xE1s ar\xE1ny, noha a darabsz\xE1mok k\xFCl\xF6nbs\xE9ge ugyan\xFAgy 4.",formula:"2 : 6 = 4 : 12 = 1 : 3; 3 : 7 \u2260 1 : 3",bullets:["K\xF6z\xF6s pozit\xEDv szorz\xE1s meg\u0151rzi az ar\xE1nyt: (2 \xD7 2)/(6 \xD7 2) = 2/6.","Azonos hozz\xE1ad\xE1s \xE1ltal\xE1ban a k\xFCl\xF6nbs\xE9get \u0151rzi, nem az ar\xE1nyt."]},{heading:"Sorrend \xE9s egys\xE9g",body:"El\u0151bb mondd meg, melyik mennyis\xE9get melyikhez viszony\xEDtod: k\xE9k : feh\xE9r \xE9s feh\xE9r : k\xE9k m\xE1s ar\xE1ny. Azonos fajt\xE1j\xFA mennyis\xE9get azonos egys\xE9gre v\xE1ltunk. K\xFCl\xF6nb\xF6z\u0151 mennyis\xE9gek h\xE1nyados\xE1hoz \xFAj egys\xE9g tartozik.",formula:"2 m : 50 cm = 200 cm : 50 cm = 4 : 1; 900 Ft : 2,5 m = 360 Ft/m",bullets:["Ebben a leck\xE9ben nemnegat\xEDv, ford\xEDtott ar\xE1nyoss\xE1gn\xE1l pozit\xEDv mennyis\xE9gekkel dolgozunk.","A darabsz\xE1mok eg\xE9sz sz\xE1mok; a sz\xE1m\xEDtott t\xF6rtr\xE9sz nem mindig megengedett l\xE9tsz\xE1m."]},{heading:"Egyenes ar\xE1nyoss\xE1g: \xE1lland\xF3 h\xE1nyados",body:"A zsin\xF3r m\xE9tere 400 Ft, nincs alapd\xEDj vagy kedvezm\xE9ny. \xCDgy 1 m 400 Ft, 1,5 m 600 Ft, 3 m 1200 Ft. Minden pozit\xEDv hosszn\xE1l ugyanannyi p\xE9nz jut egy m\xE9terre. Ha a hossz egy pozit\xEDv t\xE9nyez\u0151vel v\xE1ltozik, az \xE1r is ugyanannyiszoros.",formula:"y/x = k; y = kx; itt k = 400 Ft/m",bullets:["A nulla hosszhoz itt nulla \xE1r tartozik, de 0/0 h\xE1nyadost nem sz\xE1m\xEDtunk.","A \u201Emindkett\u0151 n\u0151\u201D megfigyel\xE9s \xF6nmag\xE1ban nem bizony\xEDt egyenes ar\xE1nyoss\xE1got."]},{heading:"Alapd\xEDj: egyenes grafikon, de nem egyenes ar\xE1nyoss\xE1g",body:"Az 500 Ft alapd\xEDj + 200 Ft/km modellben 2 km teljes d\xEDja 900 Ft, 4 km-\xE9 1300 Ft. A t\xE1vols\xE1g k\xE9tszerez\u0151d\xF6tt, a d\xEDj nem. A pozit\xEDv adatp\xE1rok h\xE1nyadosa 450 \xE9s 325 Ft/km; nem \xE1lland\xF3. Az alapd\xEDjon fel\xFCli r\xE9sz viszont minden kilom\xE9tern\xE9l 200 Ft-tal v\xE1ltozik.",formula:"y = 500 + 200x; y \u2212 500 = 200x",bullets:["A grafikon egyenes, de nem az orig\xF3n halad \xE1t.","Az \xE1lland\xF3 n\xF6vekm\xE9ny nem ugyanaz, mint az \xE1lland\xF3 h\xE1nyados."]},{heading:"Ford\xEDtott ar\xE1nyoss\xE1g: \xE1lland\xF3 szorzat",body:"Egy munka \xF6sszesen 24 seg\xEDt\u0151\xF3ra. Egy seg\xEDt\u0151 24 \xF3r\xE1t, 3 seg\xEDt\u0151 fejenk\xE9nt 8 \xF3r\xE1t, 6 seg\xEDt\u0151 4 \xF3r\xE1t, 8 seg\xEDt\u0151 3 \xF3r\xE1t dolgozik. A l\xE9tsz\xE1m \xE9s az id\u0151 szorzata ugyanaz. M\xE1sf\xE9lszeres l\xE9tsz\xE1mhoz az id\u0151t m\xE1sf\xE9llel osztjuk.",formula:"n \xD7 t = W; t = W/n; itt W = 24 seg\xEDt\u0151\xF3ra",bullets:[lr,"A seg\xEDt\u0151k sz\xE1ma pozit\xEDv eg\xE9sz. Nulla seg\xEDt\u0151h\xF6z nem rendel\xFCnk v\xE9ges elk\xE9sz\xFCl\xE9si id\u0151t.","5 seg\xEDt\u0151n\xE9l 24/5 \xF3ra = 4,8 \xF3ra: az id\u0151 lehet t\xF6rt, a l\xE9tsz\xE1m nem."]},{heading:"A cs\xF6kken\xE9s \xF6nmag\xE1ban kev\xE9s",body:"Egy 60 oldalas sz\xF6vegb\u0151l \xF3r\xE1nk\xE9nt 10 oldal fogy. 1, 2, 3 \xF3ra ut\xE1n 50, 40, 30 oldal marad. Az id\u0151 \xE9s a h\xE1tral\xE9v\u0151 oldalak szorzatai 50, 80, 90: nem \xE1lland\xF3k. Ez \xE1lland\xF3 k\xFCl\xF6nbs\xE9g\u0171 cs\xF6kken\xE9s, nem ford\xEDtott ar\xE1nyoss\xE1g.",formula:"H\xE1tral\xE9v\u0151 oldal = 60 \u2212 10 \xD7 eltelt \xF3ra; 0 \u2264 id\u0151 \u2264 6",bullets:["A sz\xF6veg elfogy\xE1sa ut\xE1n nem keletkezik negat\xEDv oldalsz\xE1m.","\u201EAz egyik n\u0151, a m\xE1sik cs\xF6kken\u201D nem el\xE9g a modell azonos\xEDt\xE1s\xE1hoz."]},{heading:"Modellv\xE1laszt\xE1s \xF6t k\xE9rd\xE9ssel",body:"Nevezd meg a k\xE9t mennyis\xE9get \xE9s egys\xE9g\xFCket; r\xF6gz\xEDtsd, mit tartunk v\xE1ltozatlannak; j\xF3solj az eredm\xE9nyre; vizsg\xE1ld a h\xE1nyadost vagy szorzatot; majd ellen\u0151rizz az eredeti t\xF6rt\xE9netben.",bullets:["Egyetlen adatp\xE1r nem igazol ar\xE1nyoss\xE1got.","T\xF6bb egyez\u0151 h\xE1nyados vagy szorzat hasznos ellen\u0151rz\xE9s, de a teljes tartom\xE1nyra \xE9rv\xE9nyes modellhez felt\xE9telek is kellenek.","Az egys\xE9gre visszavezet\xE9s megmutatja az \xE1lland\xF3t, de egy k\xF6nnyebb k\xF6z\xF6s l\xE9pt\xE9k is haszn\xE1lhat\xF3."]},{heading:"Ar\xE1ny szerinti feloszt\xE1s",body:"A 3 : 5 ar\xE1ny k\xE9t r\xE9sz egym\xE1shoz viszony\xEDtott nagys\xE1ga. Egy\xFCtt 8 egyenl\u0151 ar\xE1nyr\xE9szt alkotnak. Ha a teljes \xF6sszeget osztjuk fel, az els\u0151 r\xE9sz az eg\xE9sz 3/8-a, a m\xE1sodik 5/8-a. A 3/5 az els\u0151 r\xE9sznek a m\xE1sodikhoz viszony\xEDtott ar\xE1nya.",formula:"1600 : 8 = 200; 3 \xD7 200 = 600; 5 \xD7 200 = 1000",bullets:["Ellen\u0151rizd az \xF6sszeget is: 600 + 1000 = 1600.","Ellen\u0151rizd az ar\xE1nyt is: 600 : 1000 = 3 : 5."]},{heading:"M\xE9retar\xE1ny \xE9s k\xE9tir\xE1ny\xFA nagy\xEDt\xE1s",body:"Az 1 : 25 000 t\xE9rk\xE9pi m\xE9retar\xE1ny azonos hossz\xFAs\xE1gegys\xE9gben \xE9rtend\u0151: 1 cm a rajzon 25 000 cm a val\xF3s\xE1gban. Minden ir\xE1ny\xFA k\xE9tszeres nagy\xEDt\xE1skor a ker\xFClet k\xE9tszeres, a ter\xFClet n\xE9gyszeres. K\xE9t k\xFCl\xF6n ir\xE1ny szorz\xF3dik, ez\xE9rt a ter\xFClet nem a hossz nagy\xEDt\xE1si t\xE9nyez\u0151j\xE9vel ar\xE1nyos.",formula:"1 t\xE9rk\xE9pi cm = 250 val\xF3s m; ter\xFCleti t\xE9nyez\u0151 = 2 \xD7 2 = 4",bullets yok: ism\xE9telt szorz\xE1s \xE9s nagys\xE1grend",shortTitle:"Hatv\xE1nyok",question:"Mit sz\xE1mol a kitev\u0151, \xE9s mi\xE9rt sz\xE1m\xEDt, hol van a m\xEDnuszjel?",teaser:"Bontsd t\xE9nyez\u0151kre a hatv\xE1nyt, ellen\u0151rizd az el\u0151jelet \xE9s a nagys\xE1grendet.",description:"Pozit\xEDv eg\xE9sz kitev\u0151kkel dolgozunk. A n\xE9gyzet \xE9s k\xF6b jelent\xE9s\xE9t ter\xFClettel \xE9s t\xE9rfogattal k\xF6tj\xFCk \xF6ssze, majd t\xEDz hatv\xE1nyaival \xE9s becsl\xE9ssel ellen\u0151rizz\xFCk a nagyobb sz\xE1mokat.",goals:["Az alapot \xE9s a pozit\xEDv eg\xE9sz kitev\u0151t ism\xE9telt szorz\xE1shoz kapcsolod.","Megk\xFCl\xF6nb\xF6zteted a negat\xEDv alapot a hatv\xE1ny el\xE9 \xEDrt m\xEDnuszt\xF3l.","\xC9rtelmezed a n\xE9gyzetet \xE9s k\xF6b\xF6t mennyis\xE9gek \xE9s egys\xE9gek mellett.","T\xEDz hatv\xE1nyaival \xEDrsz fel helyi \xE9rt\xE9keket \xE9s ellen\u0151rz\xF6d a nagys\xE1grendet.","A pontos sz\xE1mol\xE1st elk\xFCl\xF6n\xEDted a k\xF6zel\xEDt\u0151 becsl\xE9st\u0151l."],prerequisites:["Szorz\xE1s el\u0151jeles sz\xE1mokkal; m\u0171veleti sorrend \xE9s z\xE1r\xF3jelek.","T\xF6rtek, tizedesek, valamint a ter\xFClet- \xE9s t\xE9rfogategys\xE9gek alapjai."],prerequisiteTopics:["szamfogalom","muveleti-sorrend","mertekegysegek"],coveredUnits:["M07.01","M07.02"],estimateMinutes:50,color:"#d9c7f2",layer:"T\xD6RZS",nextTopic:"negyzetgyok",prediction:P("hatvanyok","prediction","Melyik a nagyobb: 3\xB2 vagy 2\xB3? El\u0151bb k\xE9pzeld el az ism\xE9telt szorz\xE1st, majd add meg k\xFCl\xF6n a k\xE9t \xE9rt\xE9ket.",[h("square","3\xB2 \xE9rt\xE9ke",A("9"),[u.power],[["6","A 3\xB2 k\xE9t darab 3 t\xE9nyez\u0151t jelent, nem 3 \xD7 2-t."]]),h("cube","2\xB3 \xE9rt\xE9ke",A("8"),[u.power],[["6","A 2\xB3 h\xE1rom darab 2 t\xE9nyez\u0151: 2 \xD7 2 \xD7 2."]])],["A kitev\u0151 a t\xE9nyez\u0151k sz\xE1m\xE1t jel\xF6li.","3\xB2 = 3 \xD7 3; 2\xB3 = 2 \xD7 2 \xD7 2."],[["3 \xD7 3 = 9","K\xE9t darab 3-at szorzunk \xF6ssze."],["2 \xD7 2 \xD7 2 = 8","H\xE1rom darab 2-t szorzunk \xF6ssze."],["9 > 8","A nagyobb kitev\u0151 \xF6nmag\xE1ban nem d\xF6nti el k\xE9t k\xFCl\xF6nb\xF6z\u0151 alap\xFA hatv\xE1ny sorrendj\xE9t."]],"Az alap \xE9s a kitev\u0151 egy\xFCtt hat\xE1rozza meg a hatv\xE1nyt.",C("Mi\xE9rt nem el\xE9g csak a 2-es \xE9s 3-as kitev\u0151t \xF6sszehasonl\xEDtani?","Az alapok is elt\xE9rnek.","A t\xE9nyleges szorzatokat kell vizsg\xE1lni."),{kind:"reason",difficulty:1}),explanation:[{heading:"A kitev\u0151 a t\xE9nyez\u0151ket sz\xE1molja",body:"A 4\xB3 r\xF6viden azt jelenti: 4 \xD7 4 \xD7 4. A 4 az alap, a 3 a kitev\u0151. Pozit\xEDv eg\xE9sz kitev\u0151n\xE9l ennyi darab alapot szorzunk \xF6ssze. Az a\xB9 egyszer\u0171en a. Ez az \xFAt t\xF6rzsanyaga. A m\u0171hely k\xFCl\xF6n kitekint\xE9s\xE9ben a nem nulla alap nulladik hatv\xE1nya 1, a negat\xEDv t\xEDzkitev\u0151 pedig reciprokot jel\xF6l: p\xE9ld\xE1ul 10\u207B\xB2 = 1/100. Ezek felt\xE9teles kiterjeszt\xE9sek; a 0\u2070 nem r\xE9sze ennek a szab\xE1lynak.",formula:"4\xB3 = 4 \xD7 4 \xD7 4 = 64",bullets:["4\xB3 nem 4 \xD7 3.","Az alap \xE9s a kitev\u0151 felcser\xE9l\xE9se \xE1ltal\xE1ban m\xE1s eredm\xE9nyt ad.","Az 1 minden pozit\xEDv eg\xE9sz hatv\xE1nya 1; a 0-\xE9 0."]},{heading:"A z\xE1r\xF3jel kijel\xF6li az alapot",body:"A (\u22123)\xB2 alapja a teljes \u22123: (\u22123) \xD7 (\u22123) = 9. A \u22123\xB2 viszont a 3\xB2 ellentettje, ez\xE9rt \u22129. A hatv\xE1nyoz\xE1st a kifejez\xE9s el\xE9 \xEDrt m\xEDnusz el\u0151tt v\xE9gezz\xFCk. Ha bizonytalan vagy, \xEDrd ki a t\xE9nyez\u0151ket a z\xE1r\xF3jelekkel egy\xFCtt.",formula:"(\u22123)\xB2 = 9, de \u22123\xB2 = \u22129"},{heading:"P\xE1ros \xE9s p\xE1ratlan sz\xE1m\xFA negat\xEDv t\xE9nyez\u0151",body:"K\xE9t negat\xEDv t\xE9nyez\u0151 pozit\xEDv szorzatot ad. P\xE1ros sz\xE1m\xFA negat\xEDv t\xE9nyez\u0151t p\xE1rokba rendezve a hatv\xE1ny pozit\xEDv. P\xE1ratlan sz\xE1m\xFAn\xE1l marad egy negat\xEDv t\xE9nyez\u0151, \xEDgy az eredm\xE9ny negat\xEDv. Ez a meg\xE1llap\xEDt\xE1s nem nulla, negat\xEDv alapra \xE9s pozit\xEDv eg\xE9sz kitev\u0151re sz\xF3l.",formula:"(\u22122)\u2074 = 16; (\u22122)\u2075 = \u221232"},{heading:"N\xE9gyzet \xE9s k\xF6b: val\xF3di geometriai jelent\xE9s",body:"Egy a oldal\xFA n\xE9gyzet ter\xFClete a \xD7 a = a\xB2. Egy a \xE9l\u0171 kocka t\xE9rfogata a \xD7 a \xD7 a = a\xB3. Hossz\xFAs\xE1g eset\xE9n cm, ter\xFCletn\xE9l cm\xB2, t\xE9rfogatn\xE1l cm\xB3 az egys\xE9g. Ha minden hossz k\xE9tszeres\xE9re v\xE1ltozik, a n\xE9gyzet ter\xFClete n\xE9gyszeres, a kocka t\xE9rfogata nyolcszoros lesz.",formula:"(2a)\xB2 = 4a\xB2; (2a)\xB3 = 8a\xB3",bullets:["A geometriai hossz itt pozit\xEDv.","A fel\xFCletet k\xE9t, a t\xE9rfogatot h\xE1rom f\xFCggetlen ir\xE1nyban n\xF6velj\xFCk."]},{heading:"T\xEDz hatv\xE1nyai helyi \xE9rt\xE9ket neveznek meg",body:"10\xB9 = 10, 10\xB2 = 100, 10\xB3 = 1000. Minden \xFAjabb t\xEDzes t\xE9nyez\u0151 t\xEDzszeres \xE9rt\xE9ket ad. A 52 074 felbonthat\xF3 5 \xD7 10\u2074 + 2 \xD7 10\xB3 + 7 \xD7 10 + 4 alakban. A tizedesvessz\u0151 helyi\xE9rt\xE9k-v\xE1lt\xE1st k\xF6vet; nem sz\xE1mjegyeket t\xFCntet\xFCnk el indok n\xE9lk\xFCl.",formula:"0,047 \xD7 1000 = 47; 62 000 : 100 = 620"},{heading:"A becsl\xE9s hib\xE1t jelezhet, de nem pontos egyenl\u0151s\xE9g",body:"A 198 \xD7 51 k\xF6zel van a 200 \xD7 50 = 10 000-hez. Ez seg\xEDt \xE9szrevenni a t\xEDzszeres hib\xE1t. A pontos \xE9rt\xE9k 10 098, ez\xE9rt a 198 \xD7 51 \u2248 10 000 jel\xF6l\xE9s helyes, az egyenl\u0151s\xE9gjel nem. A becsl\xE9shez meg kell mondanunk, mely sz\xE1mokat milyen m\xF3don k\xF6zel\xEDtett\xFCk.",formula:"198 \xD7 51 \u2248 200 \xD7 50 = 10 000"},{heading:"Kitekint\xE9s: nagy sz\xE1mok norm\xE1lalakja",body:"Nagy pozit\xEDv sz\xE1mot a \xD7 10\u207F alakban is \xEDrhatunk, ahol 1 \u2264 a < 10. A r\xF6gz\xEDtett gyakorl\xF3k itt pozit\xEDv eg\xE9sz n-es p\xE9ld\xE1kat haszn\xE1lnak: 4 700 000 = 4,7 \xD7 10\u2076. A m\u0171hely a nulla \xE9s negat\xEDv t\xEDzkitev\u0151k helyi \xE9rt\xE9keit is megmutatja. A norm\xE1lalak teljes t\xE E1s t\xF6m\xF6r felsorol\xE1sa lehet, nem a gy\xF6kjel \xE9rt\xE9ke."),{kind:"reason",difficulty:1}),explanation:[{heading:"A gy\xF6kjel nemnegat\xEDv sz\xE1mot nevez meg",body:"Ha egy n\xE9gyzet ter\xFClete 49 cm\xB2, az oldala 7 cm, mert 7 \xD7 7 = 49. A \u221A49 az a nemnegat\xEDv sz\xE1m, amelynek a n\xE9gyzete 49. Nulla gy\xF6ke nulla. Negat\xEDv sz\xE1mnak a val\xF3s sz\xE1mok k\xF6z\xF6tt nincs n\xE9gyzetgy\xF6ke, mert egy val\xF3s sz\xE1m n\xE9gyzete nem lehet negat\xEDv.",formula:"\u221Aa = b azt jelenti: b \u2265 0 \xE9s b\xB2 = a; a \u2265 0"},{heading:"A gy\xF6kjel \xE9s az egyenlet nem ugyanazt k\xE9ri",body:"A \u221A25 egyetlen \xE9rt\xE9k: 5. Az x\xB2 = 25 egyenlet viszont azt k\xE9rdezi, mely val\xF3s sz\xE1mok n\xE9gyzete 25, ez\xE9rt \u22125 \xE9s 5 is megold\xE1s. Az x\xB2 = 0 csak a 0-t engedi meg. Az x\xB2 = \u22124-nek nincs val\xF3s megold\xE1sa. Ez a k\xFCl\xF6nbs\xE9g itt fogalmi kitekint\xE9s; nem \xE1ltal\xE1nos m\xE1sodfok\xFAegyenlet-megold\xF3 elj\xE1r\xE1s.",formula:"a > 0 eset\xE9n x\xB2 = a \u2192 x = \u2212\u221Aa vagy x = \u221Aa"},{heading:"A n\xE9gyzetb\u0151l visszakeresve az abszol\xFAt \xE9rt\xE9ket kapjuk",body:"A n\xE9gyzetre emel\xE9s elvesz\xEDti az eredeti el\u0151jel k\xFCl\xF6nbs\xE9g\xE9t: 5 \xE9s \u22125 n\xE9gyzete egyar\xE1nt 25. A gy\xF6kjel ezut\xE1n a nemnegat\xEDv 5-\xF6t adja vissza. Emiatt \u221A(a\xB2) = |a| minden val\xF3s a-ra; csak a \u2265 0 mellett \xEDrhatjuk egyszer\u0171en a-t.",formula:"\u221A((\u22125)\xB2) = \u221A25 = 5 = |\u22125|",bullets:["Ha a pozit\xEDv, |a| = a.","Ha a negat\xEDv, |a| = \u2212a, ami pozit\xEDv.","a = 0 eset\xE9n a gy\xF6k \xE9s az abszol\xFAt \xE9rt\xE9k is 0."]},{heading:"K\xE9t ismert n\xE9gyzet k\xF6z\xE9 szor\xEDtunk",body:"Mivel 7\xB2 = 49 \xE9s 8\xB2 = 64, a \u221A50 a 7 \xE9s 8 k\xF6z\xE9 esik. A nemnegat\xEDv sz\xE1mok k\xF6r\xE9ben a nagyobb sz\xE1mnak nagyobb a n\xE9gyzete, \xEDgy a ter\xFCletek sorrendj\xE9b\u0151l az oldalak sorrendj\xE9re is k\xF6vetkeztethet\xF
