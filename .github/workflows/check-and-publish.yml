name: Matek8 ellenőrzés és közzététel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: matek8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: A kiadás tényleges ellenőrzése
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Repó letöltése
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Actual v0.1.1 and v0.2.0 releases are used for export/import migration tests.
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Reprodukálható forrástelepítés a lockfájlból
        run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Matematikai, tartalmi és megőrző migrációs tesztek
        run: npm test
        working-directory: app
      - name: Típusellenőrzés és a valódi forrás újrafordítása
        run: npm run build
        working-directory: app
      - name: A tárolt kiadás, az új build és a tananyag egyezése
        run: node --test checks/release.test.mjs checks/content.test.mjs
      - name: Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Az eredeti tanulói utak regressziós vizsgálata
        run: npm run test:browser
        working-directory: app
      - name: Valódi böngészős és hozzáférhetőségi ellenőrzés
        run: node checks/browser.mjs
      - name: Négy új út, régi export migrációja, mobilnézet és offline kiadás
        run: node app/tests/foundations-browser.mjs
      - name: Új alapozó utak, készségnapló és célzott javító gyakorlás
        run: node app/tests/bridges-browser.mjs
      - name: Pages első engedélyezésének ellenőrzése
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node checks/pages-status.mjs
      - name: Csak a publikus alkalmazás előkészítése
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Ellenőrzött Pages-csomag
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Az ellenőrzött kiadás élesítése
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.checks.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: matek8-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages konfiguráció
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Élesítés
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
